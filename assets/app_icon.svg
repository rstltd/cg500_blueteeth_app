<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Antenna base (vertical line + small circle at bottom) -->
  <line x1="256" y1="140" x2="256" y2="350" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <circle cx="256" cy="370" r="24" fill="white"/>

  <!-- Ground plate -->
  <line x1="180" y1="390" x2="332" y2="390" stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Signal arcs (left side) -->
  <path d="M 200 240 A 70 70 0 0 1 200 300" fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M 160 210 A 120 120 0 0 1 160 330" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
  <path d="M 124 180 A 168 168 0 0 1 124 360" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.5"/>

  <!-- Signal arcs (right side) -->
  <path d="M 312 240 A 70 70 0 0 0 312 300" fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M 352 210 A 120 120 0 0 0 352 330" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
  <path d="M 388 180 A 168 168 0 0 0 388 360" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
</svg>
